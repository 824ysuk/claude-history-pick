name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # Cargo.toml の [[bin]] name と一致させる。ジョブ・ステップをまたいで同じ値を
  # 参照するための単一の定義元（他の箇所でバイナリ名をハードコードしない）。
  BINARY_NAME: agent-history-pick

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-large
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: test
        run: cargo test --release --target ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: package
        run: |
          ASSET="${BINARY_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" "$BINARY_NAME"
          shasum -a 256 "$ASSET" > "${ASSET}.sha256"

      - name: upload-release-asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz.sha256

      - name: upload-binary-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}

  universal:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aarch64-apple-darwin
          path: aarch64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: x86_64-apple-darwin
          path: x86_64

      - name: create-universal-binary
        run: |
          lipo -create "aarch64/${BINARY_NAME}" "x86_64/${BINARY_NAME}" \
            -output "$BINARY_NAME"
          ASSET="${BINARY_NAME}-universal-apple-darwin.tar.gz"
          tar -czf "$ASSET" "$BINARY_NAME"
          shasum -a 256 "$ASSET" > "${ASSET}.sha256"

      - name: upload-universal-release-asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.BINARY_NAME }}-universal-apple-darwin.tar.gz
            ${{ env.BINARY_NAME }}-universal-apple-darwin.tar.gz.sha256
