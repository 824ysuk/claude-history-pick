[package]
name = "claude-history-pick"
version = "0.1.0"
edition = "2021"
description = "Claude Code / Codex CLI のプロンプト履歴を fzf で選択して Zed に貼り付けるツール"

[[bin]]
name = "claude-history-pick"
path = "src/main.rs"

[dependencies]
# ~/.claude/history.jsonl の JSON パース（jq の代替）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# double-fork / setsid / execvp（injector の低レベル fork 制御）
libc = "0.2"

# unix_ms_to_local_iso でローカル時刻変換を unsafe なしで行う
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# guard.rs の signal 送信・getuid を unsafe なしで扱う安全ラッパー
nix = { version = "0.29", default-features = false, features = ["signal", "user"] }

# picker.rs のプレビュー用一時ファイル: ランダム名 + O_CREAT|O_EXCL + RAII で
# 予測可能パスによる symlink attack を防ぐ
tempfile = "3"

[profile.release]
# バイナリサイズ最小化
strip = true
opt-level = "z"
