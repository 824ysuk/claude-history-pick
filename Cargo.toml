[package]
name = "claude-history-pick"
version = "0.1.0"
edition = "2021"
description = "Claude Code プロンプト履歴を fzf で選択して Zed に貼り付けるツール"

[[bin]]
name = "claude-history-pick"
path = "src/main.rs"

[dependencies]
# ~/.claude/history.jsonl の JSON パース（jq の代替）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# double-fork / setsid / execvp（injector の低レベル fork 制御）
libc = "0.2"

# guard.rs の signal 送信・getuid を unsafe なしで扱う安全ラッパー
nix = { version = "0.29", default-features = false, features = ["signal", "user"] }

[dev-dependencies]
# テスト内の一時ファイルを RAII で管理（パニック時も Drop で自動削除）
tempfile = "3"

[profile.release]
# バイナリサイズ最小化
strip = true
opt-level = "z"
